<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARE OR DITCH</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0a2e;
    --surface: #2d1b4e;
    --surface2: #3d2566;
    --accent: #ff6b35;
    --accent2: #ffd700;
    --easy: #4ade80;
    --hard: #f43f5e;
    --easy-dark: #16a34a;
    --hard-dark: #be123c;
    --text: #f0e6ff;
    --muted: #a78bca;
    --card-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== ANIMATED BG ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(255,107,53,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168,85,247,0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--dur, 3s) var(--delay, 0s) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--op, 0.6); }
  }

  /* ===== SCREENS ===== */
  .screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .screen.active { display: flex; }

  /* ===== SETUP SCREEN ===== */
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(3rem, 10vw, 6rem);
    letter-spacing: 4px;
    text-align: center;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 50%, #ff3cac 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255,107,53,0.4));
    animation: logoFloat 3s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .tagline {
    font-size: 1.1rem;
    color: var(--muted);
    margin-top: 8px;
    margin-bottom: 48px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: var(--card-shadow);
  }

  .setup-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    margin-bottom: 20px;
    color: var(--accent2);
  }

  .player-inputs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

  .player-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border-radius: 12px;
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,0.06);
    transition: border-color 0.2s;
  }
  .player-input-row:focus-within { border-color: rgba(255,107,53,0.5); }

  .player-emoji { font-size: 1.4rem; }

  .player-input-row input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    flex: 1;
  }
  .player-input-row input::placeholder { color: var(--muted); font-weight: 600; }

  .add-player-btn {
    background: transparent;
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s;
  }
  .add-player-btn:hover { border-color: var(--accent); color: var(--accent); }

  .route-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }

  .route-option {
    background: var(--surface2);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .route-option:hover { transform: translateY(-2px); }
  .route-option.selected-easy { border-color: var(--easy); background: rgba(74,222,128,0.1); }
  .route-option.selected-hard { border-color: var(--hard); background: rgba(244,63,94,0.1); }

  .route-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  .route-name { font-family: 'Fredoka One', cursive; font-size: 1.1rem; display: block; }
  .route-desc { font-size: 0.8rem; color: var(--muted); margin-top: 4px; display: block; line-height: 1.3; }

  .start-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), #ff3cac);
    border: none;
    border-radius: 16px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 30px rgba(255,107,53,0.4);
  }
  .start-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,107,53,0.5); }
  .start-btn:active { transform: translateY(0); }

  /* ===== GAME SCREEN ===== */
  #gameScreen {
    justify-content: flex-start;
    padding: 16px;
    gap: 16px;
  }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
  }

  .game-logo {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .route-badge {
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .route-badge.easy { background: rgba(74,222,128,0.2); color: var(--easy); border: 1px solid var(--easy); }
  .route-badge.hard { background: rgba(244,63,94,0.2); color: var(--hard); border: 1px solid var(--hard); }

  /* BOARD */
  .board-container {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 20px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  .board {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-start;
  }

  .tile {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.75rem;
    position: relative;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .tile-normal { background: var(--surface2); color: var(--muted); border: 1px solid rgba(255,255,255,0.06); }
  .tile-start { background: linear-gradient(135deg, #4ade80, #22c55e); color: white; font-family: 'Fredoka One', cursive; }
  .tile-finish { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #1a0a2e; font-family: 'Fredoka One', cursive; }
  .tile-easy-card { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3); color: var(--easy); }
  .tile-hard-card { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); color: var(--hard); }

  .tile .tile-icon { font-size: 1.1rem; }
  .tile .tile-num { font-size: 0.65rem; position: absolute; top: 3px; left: 5px; color: var(--muted); }

  .piece {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid white;
    position: absolute;
    font-size: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 10;
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: default;
  }

  /* PLAYERS PANEL */
  .players-panel {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 900px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .player-chip {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 160px;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .player-chip.active-player {
    border-color: var(--accent);
    background: rgba(255,107,53,0.12);
    box-shadow: 0 0 20px rgba(255,107,53,0.2);
    transform: translateY(-2px);
  }

  .player-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 900;
    color: white;
    flex-shrink: 0;
  }

  .player-info .player-name {
    font-weight: 800;
    font-size: 0.9rem;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100px;
  }
  .player-info .player-pos {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* GAME ACTION AREA */
  .action-area {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .turn-banner {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--accent2);
    text-align: center;
  }

  /* THE CARD */
  .card-display {
    perspective: 1000px;
    width: 100%;
    max-width: 420px;
  }

  .card-inner {
    background: var(--surface);
    border-radius: 20px;
    padding: 28px 28px 24px;
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9) rotate(-2deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  .card-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .card-inner.easy-card::before { background: linear-gradient(90deg, var(--easy-dark), var(--easy)); }
  .card-inner.hard-card::before { background: linear-gradient(90deg, var(--hard-dark), var(--hard)); }

  .card-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .easy-badge { background: rgba(74,222,128,0.15); color: var(--easy); }
  .hard-badge { background: rgba(244,63,94,0.15); color: var(--hard); }

  .card-question {
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .card-note {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .accept-btn, .decline-btn {
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .accept-btn {
    background: linear-gradient(135deg, var(--easy-dark), var(--easy));
    color: white;
    box-shadow: 0 6px 20px rgba(74,222,128,0.3);
  }
  .accept-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(74,222,128,0.4); }

  .decline-btn {
    background: linear-gradient(135deg, var(--hard-dark), var(--hard));
    color: white;
    box-shadow: 0 6px 20px rgba(244,63,94,0.3);
  }
  .decline-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(244,63,94,0.4); }

  /* RESULT / DICE AREA */
  .result-area {
    text-align: center;
    animation: fadeIn 0.4s ease;
    width: 100%;
    max-width: 420px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .decision-display {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    margin-bottom: 12px;
  }
  .decision-accept { color: var(--easy); }
  .decision-decline { color: var(--hard); }

  .dice-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin: 12px 0;
  }

  .dice {
    width: 64px;
    height: 64px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.5);
    transition: transform 0.1s;
  }
  .dice.rolling {
    animation: diceRoll 0.8s ease;
  }
  @keyframes diceRoll {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(180deg) scale(1.2); }
    50% { transform: rotate(360deg) scale(0.9); }
    75% { transform: rotate(540deg) scale(1.1); }
    100% { transform: rotate(720deg) scale(1); }
  }

  .dice-result-text {
    font-weight: 800;
    font-size: 1rem;
    color: var(--muted);
  }

  .movement-text {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    margin-top: 8px;
  }
  .move-forward { color: var(--easy); }
  .move-backward { color: var(--hard); }

  .next-turn-btn {
    margin-top: 14px;
    padding: 14px 36px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 20px rgba(168,85,247,0.3);
  }
  .next-turn-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(168,85,247,0.4); }

  /* DRAW CARD BTN */
  .draw-card-btn {
    padding: 16px 44px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 16px;
    color: #1a0a2e;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 28px rgba(255,215,0,0.3);
  }
  .draw-card-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 36px rgba(255,215,0,0.4); }

  /* WIN SCREEN */
  #winScreen {
    text-align: center;
    gap: 20px;
  }
  .win-emoji { font-size: 5rem; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-20px) rotate(5deg); }
  }
  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 8vw, 4rem);
    background: linear-gradient(135deg, var(--accent2), var(--accent), #ff3cac);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .win-name { font-size: 1.5rem; font-weight: 800; color: var(--text); }
  .play-again-btn {
    padding: 16px 44px;
    background: linear-gradient(135deg, var(--accent), #ff3cac);
    border: none;
    border-radius: 16px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(255,107,53,0.4);
    margin-top: 10px;
    transition: all 0.2s;
  }
  .play-again-btn:hover { transform: translateY(-3px); }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 12px;
    opacity: 0;
    animation: confettiFall linear forwards;
    z-index: 100;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none !important; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  @media (max-width: 600px) {
    .tile { width: 44px; height: 44px; font-size: 0.65rem; }
    .card-actions { grid-template-columns: 1fr; }
    .setup-card { padding: 24px 20px; }
    .route-selector { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- ==================== SETUP SCREEN ==================== -->
<div class="screen active" id="setupScreen">
  <div class="logo">DARE OR DITCH</div>
  <div class="tagline">Accept the dare · Ditch the dare · Roll your fate</div>

  <div class="setup-card">
    <div class="setup-title">👥 Players</div>
    <div class="player-inputs" id="playerInputs">
      <div class="player-input-row"><span class="player-emoji">🔴</span><input type="text" placeholder="Player 1" maxlength="16"></div>
      <div class="player-input-row"><span class="player-emoji">🔵</span><input type="text" placeholder="Player 2" maxlength="16"></div>
    </div>
    <button class="add-player-btn" onclick="addPlayer()">+ Add Player (max 6)</button>

    <div class="setup-title" style="margin-top:28px;">🛣️ Choose Route</div>
    <div class="route-selector">
      <div class="route-option" id="easyRouteOpt" onclick="selectRoute('easy')">
        <span class="route-icon">🌿</span>
        <span class="route-name" style="color:var(--easy)">EASY</span>
        <span class="route-desc">Longer path · Mixed cards · Decline costs 1 die</span>
      </div>
      <div class="route-option" id="hardRouteOpt" onclick="selectRoute('hard')">
        <span class="route-icon">🔥</span>
        <span class="route-name" style="color:var(--hard)">HARD</span>
        <span class="route-desc">Shorter path · All hard cards · Decline costs 2 dice</span>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">START GAME 🎲</button>
  </div>
</div>

<!-- ==================== GAME SCREEN ==================== -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="game-logo">DARE OR DITCH</div>
    <div class="route-badge" id="routeBadge">EASY ROUTE</div>
  </div>

  <!-- Players Panel -->
  <div class="players-panel" id="playersPanel"></div>

  <!-- Board -->
  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <!-- Action Area -->
  <div class="action-area">
    <div class="turn-banner" id="turnBanner"></div>

    <!-- Draw Button -->
    <div id="drawSection">
      <button class="draw-card-btn" onclick="drawCard()">✨ DRAW A CARD</button>
    </div>

    <!-- Card Display -->
    <div class="card-display hidden" id="cardSection">
      <div class="card-inner" id="cardInner">
        <div class="card-type-badge" id="cardTypeBadge"></div>
        <div class="card-question" id="cardQuestion"></div>
        <div class="card-note" id="cardNote"></div>
        <div class="card-actions">
          <button class="accept-btn" onclick="decide('accept')">✅ ACCEPT<br><small style="font-size:0.75rem;font-family:Nunito,sans-serif;font-weight:700">Roll 1 die → forward</small></button>
          <button class="decline-btn" id="declineBtn" onclick="decide('decline')">❌ DITCH<br><small id="declineCost" style="font-size:0.75rem;font-family:Nunito,sans-serif;font-weight:700"></small></button>
        </div>
      </div>
    </div>

    <!-- Result Area -->
    <div class="result-area hidden" id="resultSection">
      <div class="decision-display" id="decisionDisplay"></div>
      <div class="dice-area" id="diceArea"></div>
      <div class="dice-result-text" id="diceResultText"></div>
      <div class="movement-text" id="movementText"></div>
      <button class="next-turn-btn" onclick="nextTurn()">NEXT TURN ➡️</button>
    </div>
  </div>
</div>

<!-- ==================== WIN SCREEN ==================== -->
<div class="screen" id="winScreen">
  <div class="win-emoji">🏆</div>
  <div class="win-title">WINNER!</div>
  <div class="win-name" id="winnerName"></div>
  <button class="play-again-btn" onclick="location.reload()">PLAY AGAIN 🎲</button>
</div>

<script>
// ===================================================================
// CARD DATA — replace this with a JSON fetch from your cards.json
// ===================================================================
const CARDS = {
  easy: [
    { text: "Arm wrestle the player in last place!", note: "Best 2 out of 3." },
    { text: "Swap places on the board with the player in last place.", note: "Both of you move to each other's tile." },
    { text: "Do your best impression of a chicken for 10 seconds.", note: "The group votes if it's good enough." },
    { text: "Tell a joke. If nobody laughs, you moved backwards anyway!", note: "Majority rules." },
    { text: "Say the alphabet backwards as fast as you can.", note: "You have 30 seconds." },
    { text: "Let the player to your left give you a dare word — say it in a sentence 3 times.", note: "They pick the word." },
    { text: "High five every player and say their name.", note: "Must be in order." },
    { text: "Do your best robot dance for 5 seconds.", note: "Everyone votes thumbs up/down." },
    { text: "Describe your last dream without saying 'dream'.", note: "You have 20 seconds." },
    { text: "Pretend to be a news reporter covering the current game situation.", note: "At least 15 seconds." },
  ],
  hard: [
    { text: "Shout \"THE EARLY WORM GETS THE BIRD!\" at the top of your lungs.", note: "Must be clearly heard by all." },
    { text: "Reenact a forbidden meme of the group's choice.", note: "Group picks, you perform." },
    { text: "Drop down and give everyone 20 push-ups!", note: "All 20. No breaks." },
    { text: "Speak in a made-up language for the next 2 turns.", note: "No real words allowed." },
    { text: "Let the group style your hair for the rest of the game.", note: "No mirrors allowed." },
    { text: "Do the worm across the room and back.", note: "Full length worm only." },
    { text: "Call someone outside the game and sing them Happy Birthday.", note: "Speaker mode required." },
    { text: "Let the group give you a nickname for the rest of the game.", note: "Everyone must agree on one name." },
    { text: "Lick your elbow. (Spoiler: almost impossible.)", note: "Verified by the group." },
    { text: "Do your best villain monologue about why YOU deserve to win.", note: "Minimum 20 seconds. Dramatic required." },
  ]
};

// ===================================================================
// BOARD LAYOUT CONFIG
// ===================================================================
const BOARD_CONFIG = {
  easy:  { total: 28, cardTiles: [3,6,9,12,15,17,20,23,26], hardCardTiles: [10,18,25] },
  hard:  { total: 18, cardTiles: [2,4,6,8,10,12,14,16], hardCardTiles: [2,4,6,8,10,12,14,16] }
};

// ===================================================================
// STATE
// ===================================================================
const PLAYER_EMOJIS = ['🔴','🔵','🟡','🟢','🟣','🟠'];
const PLAYER_COLORS = ['#ef4444','#3b82f6','#eab308','#22c55e','#a855f7','#f97316'];

let state = {
  players: [],
  route: 'easy',
  currentPlayer: 0,
  currentCard: null,
  phase: 'draw', // draw | card | result
  totalTiles: 0
};

// ===================================================================
// SETUP
// ===================================================================
let selectedRoute = null;
let playerCount = 2;

function addPlayer() {
  if (playerCount >= 6) return;
  playerCount++;
  const emojis = PLAYER_EMOJIS;
  const row = document.createElement('div');
  row.className = 'player-input-row';
  row.innerHTML = `<span class="player-emoji">${emojis[playerCount-1]}</span><input type="text" placeholder="Player ${playerCount}" maxlength="16">`;
  document.getElementById('playerInputs').appendChild(row);
  if (playerCount >= 6) document.querySelector('.add-player-btn').style.opacity = '0.4';
}

function selectRoute(route) {
  selectedRoute = route;
  document.getElementById('easyRouteOpt').classList.remove('selected-easy','selected-hard');
  document.getElementById('hardRouteOpt').classList.remove('selected-easy','selected-hard');
  document.getElementById(route === 'easy' ? 'easyRouteOpt' : 'hardRouteOpt').classList.add(route === 'easy' ? 'selected-easy' : 'selected-hard');
}

function startGame() {
  const inputs = document.querySelectorAll('#playerInputs input');
  const players = [];
  inputs.forEach((inp, i) => {
    const name = inp.value.trim() || `Player ${i+1}`;
    players.push({ name, position: 0, color: PLAYER_COLORS[i], emoji: PLAYER_EMOJIS[i] });
  });
  if (players.length < 2) { alert('Need at least 2 players!'); return; }
  if (!selectedRoute) { alert('Please select a route!'); return; }

  state.players = players;
  state.route = selectedRoute;
  state.currentPlayer = 0;
  state.phase = 'draw';
  state.totalTiles = BOARD_CONFIG[selectedRoute].total;

  document.getElementById('setupScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');

  renderBoard();
  renderPlayers();
  updateTurnBanner();
  setPhase('draw');

  const badge = document.getElementById('routeBadge');
  badge.textContent = selectedRoute === 'easy' ? '🌿 EASY ROUTE' : '🔥 HARD ROUTE';
  badge.className = `route-badge ${selectedRoute}`;
}

// ===================================================================
// BOARD
// ===================================================================
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const cfg = BOARD_CONFIG[state.route];

  for (let i = 0; i <= cfg.total; i++) {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.id = `tile-${i}`;

    if (i === 0) {
      tile.classList.add('tile-start');
      tile.innerHTML = '<span class="tile-icon">🏁</span>';
    } else if (i === cfg.total) {
      tile.classList.add('tile-finish');
      tile.innerHTML = '<span class="tile-icon">🏆</span>';
    } else if (cfg.hardCardTiles.includes(i)) {
      tile.classList.add('tile-hard-card');
      tile.innerHTML = `<span class="tile-num">${i}</span><span class="tile-icon">🔥</span>`;
    } else if (cfg.cardTiles.includes(i)) {
      tile.classList.add('tile-easy-card');
      tile.innerHTML = `<span class="tile-num">${i}</span><span class="tile-icon">🃏</span>`;
    } else {
      tile.classList.add('tile-normal');
      tile.innerHTML = `<span>${i}</span>`;
    }

    board.appendChild(tile);
  }
  placePieces();
}

function placePieces() {
  // Remove existing pieces
  document.querySelectorAll('.piece').forEach(p => p.remove());

  state.players.forEach((p, i) => {
    const tile = document.getElementById(`tile-${p.position}`);
    if (!tile) return;
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.id = `piece-${i}`;
    piece.style.background = p.color;
    piece.style.fontSize = '0.6rem';
    piece.textContent = p.emoji;

    // Offset pieces on same tile
    const samePos = state.players.filter((pp, ii) => ii < i && pp.position === p.position).length;
    piece.style.top = `${2 + samePos * 10}px`;
    piece.style.right = `${2 + samePos * 10}px`;

    tile.style.position = 'relative';
    tile.appendChild(piece);
  });
}

// ===================================================================
// PLAYERS PANEL
// ===================================================================
function renderPlayers() {
  const panel = document.getElementById('playersPanel');
  panel.innerHTML = '';
  state.players.forEach((p, i) => {
    const chip = document.createElement('div');
    chip.className = 'player-chip' + (i === state.currentPlayer ? ' active-player' : '');
    chip.id = `chip-${i}`;
    chip.innerHTML = `
      <div class="player-avatar" style="background:${p.color}">${p.emoji}</div>
      <div class="player-info">
        <span class="player-name">${p.name}</span>
        <span class="player-pos">Tile ${p.position} / ${state.totalTiles}</span>
      </div>
    `;
    panel.appendChild(chip);
  });
}

function updatePlayerChips() {
  state.players.forEach((p, i) => {
    const chip = document.getElementById(`chip-${i}`);
    if (!chip) return;
    chip.className = 'player-chip' + (i === state.currentPlayer ? ' active-player' : '');
    chip.querySelector('.player-pos').textContent = `Tile ${p.position} / ${state.totalTiles}`;
  });
}

// ===================================================================
// TURN LOGIC
// ===================================================================
function updateTurnBanner() {
  const p = state.players[state.currentPlayer];
  document.getElementById('turnBanner').textContent = `${p.emoji} ${p.name}'s Turn`;
}

function setPhase(phase) {
  state.phase = phase;
  document.getElementById('drawSection').classList.toggle('hidden', phase !== 'draw');
  document.getElementById('cardSection').classList.toggle('hidden', phase !== 'card');
  document.getElementById('resultSection').classList.toggle('hidden', phase !== 'result');
}

function getTileType(position) {
  const cfg = BOARD_CONFIG[state.route];
  if (cfg.hardCardTiles.includes(position)) return 'hard';
  if (cfg.cardTiles.includes(position)) return 'easy';
  return null;
}

function drawCard() {
  const p = state.players[state.currentPlayer];
  const tileType = getTileType(p.position);

  let cardType;
  if (state.route === 'hard') {
    cardType = 'hard';
  } else {
    // Easy route: use tile type if on card tile, else random
    if (tileType === 'hard') cardType = 'hard';
    else cardType = 'easy';
  }

  const pool = CARDS[cardType];
  const card = pool[Math.floor(Math.random() * pool.length)];
  state.currentCard = { ...card, type: cardType };

  // Update card UI
  const cardInner = document.getElementById('cardInner');
  cardInner.className = 'card-inner ' + (cardType === 'hard' ? 'hard-card' : 'easy-card');

  const badge = document.getElementById('cardTypeBadge');
  badge.className = 'card-type-badge ' + (cardType === 'hard' ? 'hard-badge' : 'easy-badge');
  badge.textContent = (cardType === 'hard' ? '🔥 HARD CARD' : '🃏 EASY CARD');

  document.getElementById('cardQuestion').textContent = card.text;
  document.getElementById('cardNote').textContent = card.note;

  const isHardRoute = state.route === 'hard';
  const declineCost = (isHardRoute || cardType === 'hard') ? 'Roll 2 dice → backward' : 'Roll 1 die → backward';
  document.getElementById('declineCost').textContent = declineCost;

  setPhase('card');
}

function decide(choice) {
  const isHardRoute = state.route === 'hard';
  const cardType = state.currentCard.type;

  let numDice, direction;
  if (choice === 'accept') {
    numDice = 1;
    direction = 'forward';
  } else {
    direction = 'backward';
    numDice = (isHardRoute || cardType === 'hard') ? 2 : 1;
  }

  setPhase('result');

  const decisionEl = document.getElementById('decisionDisplay');
  if (choice === 'accept') {
    decisionEl.innerHTML = '<span class="decision-accept">✅ ACCEPTED! Roll to move forward...</span>';
  } else {
    decisionEl.innerHTML = '<span class="decision-decline">❌ DITCHED! Roll to see how far back...</span>';
  }

  document.getElementById('diceArea').innerHTML = '';
  document.getElementById('diceResultText').textContent = '';
  document.getElementById('movementText').textContent = '';

  // Roll dice with animation
  setTimeout(() => rollDice(numDice, direction), 300);
}

const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

function rollDice(numDice, direction) {
  const diceArea = document.getElementById('diceArea');
  diceArea.innerHTML = '';

  const diceEls = [];
  for (let d = 0; d < numDice; d++) {
    const die = document.createElement('div');
    die.className = 'dice rolling';
    die.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
    diceArea.appendChild(die);
    diceEls.push(die);
  }

  // Animate for 0.8s, then settle
  let total = 0;
  const rolls = [];
  for (let d = 0; d < numDice; d++) {
    const val = Math.floor(Math.random() * 6) + 1;
    rolls.push(val);
    total += val;
  }

  setTimeout(() => {
    diceEls.forEach((die, i) => {
      die.classList.remove('rolling');
      die.textContent = DICE_FACES[rolls[i] - 1];
    });

    document.getElementById('diceResultText').textContent = numDice > 1 ? `${rolls.join(' + ')} = ${total} total` : '';

    const p = state.players[state.currentPlayer];
    let newPos;
    if (direction === 'forward') {
      newPos = Math.min(p.position + total, state.totalTiles);
      document.getElementById('movementText').innerHTML = `<span class="move-forward">⬆️ Move FORWARD ${total} tile${total > 1 ? 's' : ''}!</span>`;
    } else {
      newPos = Math.max(p.position - total, 0);
      document.getElementById('movementText').innerHTML = `<span class="move-backward">⬇️ Move BACK ${total} tile${total > 1 ? 's' : ''}!</span>`;
    }

    p.position = newPos;
    updatePlayerChips();
    placePieces();

    // Check win
    if (newPos >= state.totalTiles) {
      setTimeout(() => triggerWin(p), 600);
    }
  }, 900);
}

function nextTurn() {
  state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
  updateTurnBanner();
  updatePlayerChips();
  setPhase('draw');
}

// ===================================================================
// WIN
// ===================================================================
function triggerWin(player) {
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('winScreen').classList.add('active');
  document.getElementById('winnerName').textContent = `${player.emoji} ${player.name} wins!`;
  spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#ff6b35','#ffd700','#4ade80','#f43f5e','#a855f7','#3b82f6'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    piece.style.animationDelay = (Math.random() * 1.5) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (8 + Math.random() * 8) + 'px';
    piece.style.height = (8 + Math.random() * 8) + 'px';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove());
  }
}

// ===================================================================
// STARS BG
// ===================================================================
(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--delay', (Math.random() * 4) + 's');
    star.style.setProperty('--op', (0.3 + Math.random() * 0.7).toString());
    container.appendChild(star);
  }
})();
</script>
</body>
</html>
